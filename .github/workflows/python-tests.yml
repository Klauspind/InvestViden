name: Python tests

on:
  push:
    branches:
      - main
      - "iv-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check IV-008 PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          foreach ($file in @('KONFIGURER_INVESTVIDEN_MORGENFLOW.ps1', 'START_INVESTVIDEN_MORGENFLOW.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
