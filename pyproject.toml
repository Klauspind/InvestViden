[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investkb"
version = "0.1.0"
description = "Lokal, AI-uafhængig knowledgebase til investeringskilder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
investkb = "investkb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

